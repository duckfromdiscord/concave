[package]
name = "concave"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2.2.10", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "*", features = ["bundled"] }
diesel_migrations = "2.2.0"
deadpool-sqlite = "0.11.0"
deadpool-diesel = { version = "0.6.1", features = ["sqlite"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
bcrypt = "0.17.0"
actix-web = { version = "4.11.0", features = ["macros"] }
clap = { version = "4.5.38", features = ["derive"] }
log = "0.4.27"
musicbrainz_rs = "0.9.1"
chrono = { version = "0.4.41", features = ["serde"] }
custom_error = "1.9.2"
thiserror = "2.0.12"
either = "1.15.0"
reqwest = { version = "0.12.18", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono-tz = "0.10.3"
env_logger = "0.11.8"
actix-files = "0.6.6"
uuid = "1.17.0"
regex = "1.11.1"
once_cell = "1.21.3"
bytes = "1.10.1"
